name: CI

on:
  pull_request: 
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Installer les dependances
        run: uv sync

      - name: lint
        run: uv run ruff check . 
      
      - name: formattage
        run: uv run ruff format --check .
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps: 

      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}  

      - name: Installer les dépendances
        run: uv sync

      - name: Lancer les tests
        run: uv run pytest -v
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync

      - name: build
        run: uv build

      
