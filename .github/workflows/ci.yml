name: CI

on:
  pull_request: 
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    
      - uses: actions/checkout@v7
      - uses:  github/actions/setup
        with:
          python-version: '3.14'

      - name: lint
        run: uv run ruff check . 
      
      - name: formattage
        run: uv run ruff format --check .
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps: 

      - uses: actions/checkout@v7
      - uses:  github/actions/setup
        with:
          python-version: '3.14'

      - name: Lancer les tests couverture
        run: uv run pytest -v --cov=fleet_api --cov-report=html --cov-report=term
      - uses: actions/upload-artifact@v7
        with:
          name: couverture-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7
      - uses:  github/actions/setup
        with:
          python-version: '3.14'

      - name: build
        run: uv build

      
